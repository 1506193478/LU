name: iOS IPA

# 只在手动点击时跑，不占每次 push 的额度，也方便反复重试。
on:
  workflow_dispatch:

permissions:
  # 需要 write 才能在最后把 IPA 挂到 Release 上（原来只有 read）。
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本必须和 pubspec.yaml 里 environment.flutter 一致，
      # 不一致时 pub 会直接报版本约束不满足。
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Pub get
        run: flutter pub get

      # --no-codesign：没有签名证书也能出 .app，后续用 Sideloadly 自签。
      # 这里不单独跑 pod install —— Generated.xcconfig 要 flutter build 才生成，
      # 提前手动跑 pod install 会找不到它。
      - name: Build iOS
        run: |
          # 关掉 Swift Package Manager，回到 CocoaPods。
          #
          # 这个项目所有插件都有 podspec，走 Pods 一直是对的；SPM 在 CI 上
          # 会临时去 GitHub 抓 DKImagePickerController / SDWebImage 等一堆包，
          # 解析慢且不稳定，失败时 Flutter 还会报一句误导性的 "需要
          # Development Team"，掩盖真正原因。
          flutter config --no-enable-swift-package-manager
          flutter build ios --release --no-codesign -v

      - name: Package IPA
        run: |
          set -e
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry "LU_${VERSION}_ios.ipa" Payload
          ls -lh "LU_${VERSION}_ios.ipa"
          echo "IPA_NAME=LU_${VERSION}_ios.ipa" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      # IPA 必须跟着 Release 走，不能只躺在 Actions 的 artifact 里
      # （artifact 7 天就过期，而且下载要先登录）。
      #
      # 应用内更新在 iOS 上是「检测到新版 → 跳发布页」的策略：IPA 没法在应用内
      # 静默安装，所以「发布页上有没有 IPA」就等于「iOS 用户能不能更新」。
      # 安卓/Windows 走 assets 直链下载，iOS 走发布页，三端资产必须齐。
      - name: Attach IPA to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::warning::Release $VERSION 还没建，IPA 这次只留 artifact；发版后重跑本工作流即可挂上"
            exit 0
          fi
          gh release upload "$VERSION" "build/ipa/$IPA_NAME" --clobber
          gh release view "$VERSION" --json assets --jq '.assets[].name'

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LU-ios-ipa
          path: build/ipa/*.ipa
          retention-days: 7
          if-no-files-found: error
