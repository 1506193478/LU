name: iOS Native Build

# 原生 SwiftUI 端（ios_native/）的编译校验 + 无签名 IPA。
# 和 ios.yml（Flutter 线）互不影响。
on:
  workflow_dispatch:
  push:
    paths:
      - "ios_native/**"
      - ".github/workflows/ios-native.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios_native
        run: |
          xcodegen generate
          ls -la

      - name: Build
        working-directory: ios_native
        run: |
          set -o pipefail
          xcodebuild \
            -project LU.xcodeproj \
            -scheme LU \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log

      - name: Package unsigned IPA
        working-directory: ios_native
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry LU-native-unsigned.ipa Payload
          ls -lh LU-native-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LU-native-ipa
          path: ios_native/LU-native-unsigned.ipa
          if-no-files-found: error

      - name: Publish to Release (ios-native-latest)
        if: success()
        working-directory: ios_native
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          {
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Build/Products/Release-iphoneos/LU.app/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/Build/Products/Release-iphoneos/LU.app/Info.plist)
          {
            echo "## LU iOS 原生端 · 无签名 IPA（自动构建）"
            echo ""
            echo "- 构建时间：$(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- 提交：${{ github.sha }}"
            echo "- 版本：$VERSION ($BUILD)"
            echo ""
            echo "### 安装说明（无签名，任选其一）"
            echo ""
            echo "1. Sideloadly / AltStore：连电脑用 Apple ID 签名后侧载（免费证书 7 天有效）"
            echo "2. Xcode：clone 仓库后 cd ios_native && xcodegen generate，用自己的证书打包"
            echo "3. TrollStore（如系统版本支持）：直接安装"
          } > release-notes.md
          set -x
          if gh release view ios-native-latest > /dev/null 2>&1; then
            echo "release 已存在，直接上传资产"
          else
            gh release create ios-native-latest --title "LU iOS 原生端（无签名）" --notes-file release-notes.md
          fi
          gh release upload ios-native-latest LU-native-unsigned.ipa --clobber
          echo "release done"
          } 2>&1 | tee publish.log

      - name: Collect error lines
        if: failure()
        working-directory: ios_native
        run: |
          mkdir -p ../ci-logs
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "== error lines =="
            grep -n -B2 -A8 "error:" build.log | head -160
            echo "== tail =="
            tail -60 build.log
          } > ../ci-logs/ios-native-errors.txt || true
          wc -l ../ci-logs/ios-native-errors.txt

      - name: Commit error log to repo
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-logs/ios-native-errors.txt
          git commit -m "ci: ios-native 构建错误日志（自动提交）" || echo "nothing to commit"
          git push || true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios_native/build.log
          if-no-files-found: ignore
